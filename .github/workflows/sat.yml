name: sat

on:
  workflow_dispatch:
  # Scheduled by kahuola-sat-scheduler (Cloudflare cron). Do not
  # re-enable — double triggering.
  # (SAT-4b: :05, :15, ... — CONUS ADPC lands ~4 min after scan start,
  # Hawaiʻi ADPF ~12 min after.)
  # schedule:
  #   - cron: "5-59/10 * * * *"

concurrency:
  group: sat-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests (fast, no network)
        id: tests
        run: pytest -q -m "not network"

      - name: CONUS
        id: conus
        if: steps.tests.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python run.py --region conus --upload

      # Runs even if CONUS failed; the job still fails if either step failed.
      - name: Hawaii (shadow)
        id: hawaii
        if: always() && steps.tests.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python run.py --region hawaii --upload --shadow
