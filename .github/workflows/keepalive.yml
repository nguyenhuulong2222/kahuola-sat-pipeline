name: keepalive

# GitHub's 60-day inactivity rule only disables *scheduled* workflows.
# sat.yml no longer has a schedule (kahuola-sat-scheduler dispatches it), so
# this keepalive is not needed; kept for manual use only.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 12 1 * *"

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Commit .keepalive
        run: |
          date -u +%Y-%m-%d > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --cached --quiet; then
            echo "already up to date"
          else
            git commit -m "keepalive: $(date -u +%Y-%m-%d)"
            git push
          fi
